<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ink: #16202c;
        --muted: #6b7683;
        --line: #e7eaee;
        --accent: #1b6ef3;
        --ok: #0f7a4d;
        --warn: #b37400;
        --fail: #b3212f;
      }
      * { box-sizing: border-box; }
      body {
        width: 372px;
        margin: 0;
        font: 13px/1.6 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: #fff;
      }
      .wrap { padding: 16px 16px 14px; }

      .head { display: flex; gap: 10px; align-items: flex-start; }
      .dot {
        flex: 0 0 28px; height: 28px; border-radius: 9px;
        background: linear-gradient(135deg, #1b6ef3, #0f7a4d);
        color: #fff; font-size: 14px; display: flex;
        align-items: center; justify-content: center;
      }
      .head-text { min-width: 0; }
      .title {
        font-size: 13.5px; font-weight: 600; line-height: 1.45;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .doi { color: var(--muted); font-size: 11.5px; margin-top: 2px; word-break: break-all; }

      .chips { display: flex; gap: 6px; margin: 12px 0 0; flex-wrap: wrap; }
      .chip {
        font-size: 11.5px; color: #3d4854; background: #f2f5f9;
        border-radius: 999px; padding: 2px 9px;
      }
      .chip.dim { color: var(--muted); background: #f7f8fa; }

      .loc {
        margin-top: 14px; border: 1px solid var(--line); border-radius: 10px;
        padding: 10px 12px; display: flex; align-items: center; gap: 10px;
      }
      .loc-main { min-width: 0; flex: 1; }
      .loc-label { font-size: 11px; color: var(--muted); }
      .loc-value {
        font-size: 12.5px; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis;
      }
      .ghost {
        border: 1px solid var(--line); background: #fff; color: var(--ink);
        border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer;
      }
      .ghost:hover { background: #f6f8fb; }

      .primary {
        margin-top: 12px; width: 100%; border: 0; border-radius: 10px;
        background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600;
        padding: 10px; cursor: pointer; transition: filter .15s;
      }
      .primary:hover { filter: brightness(1.06); }
      .primary:disabled { background: #b9c4d2; cursor: default; filter: none; }

      .list { margin-top: 12px; display: none; }
      .list.on { display: block; }
      .row {
        display: flex; align-items: center; gap: 8px;
        padding: 5px 0; font-size: 12px; border-top: 1px solid #f1f3f6;
      }
      .row:first-child { border-top: 0; }
      .row .name {
        flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; color: #3d4854;
      }
      .row .state { font-size: 11.5px; color: var(--muted); }
      .row.ok .state { color: var(--ok); }
      .row.fail .state { color: var(--fail); }
      .row.work .state { color: var(--accent); }

      .tip { margin-top: 10px; font-size: 11.5px; color: var(--muted); line-height: 1.55; }
      .tip b { color: var(--ink); font-weight: 600; }
      .empty { padding: 8px 0; font-size: 12px; color: var(--warn); }

      .banner {
        margin-top: 12px;
        border-radius: 9px;
        padding: 8px 11px;
        font-size: 12px;
        line-height: 1.55;
        border: 1px solid transparent;
      }
      .banner[hidden] { display: none; }
      .banner.run { background: #eef4ff; color: #1857c8; border-color: #d6e4ff; }
      .banner.ok { background: #eaf7f0; color: #0f7a4d; border-color: #cfeadd; }
      .banner.bad { background: #fdeeee; color: #a11224; border-color: #f6d3d3; }
      .banner b { font-weight: 600; }
      .banner .sub { display: block; font-size: 11px; opacity: .8; margin-top: 2px; }

      .zrow {
        display: flex; align-items: center; gap: 8px;
        margin-top: 10px; font-size: 12.5px; cursor: pointer;
      }
      .zrow input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
      .zrow.off { color: var(--muted); cursor: default; }
      .zrow .zstate { margin-left: auto; font-size: 11.5px; color: var(--muted); }
      .zrow .zstate.ok { color: var(--ok); }
      .zrow .zstate.bad { color: var(--fail); }

      .ztarget {
        width: 100%; margin-top: 8px; padding: 7px 9px;
        font: 12.5px "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
        color: var(--ink); background: #fff;
        border: 1px solid var(--line); border-radius: 9px;
      }
      .ztarget[hidden] { display: none; }

      .batch { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
      .batch summary {
        cursor: pointer; font-size: 12.5px; color: var(--muted);
        list-style: none; user-select: none;
      }
      .batch summary::-webkit-details-marker { display: none; }
      .batch summary::before { content: "▸ "; }
      .batch[open] summary::before { content: "▾ "; }
      .bcount { margin-left: 6px; color: var(--muted); }
      .batch textarea, .batch input[type="text"] {
        width: 100%; margin-top: 8px; padding: 8px 10px;
        font: 12px "Consolas", "Cascadia Mono", monospace;
        border: 1px solid var(--line); border-radius: 9px;
        background: #fff; color: var(--ink); resize: vertical;
      }
      .bhint { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
      .bhint.warn { color: var(--fail); }
      .blist { list-style: none; margin: 8px 0 0; padding: 0; max-height: 190px; overflow-y: auto; }
      .blist li {
        display: flex; gap: 8px; align-items: baseline;
        font-size: 11.5px; padding: 4px 0; border-bottom: 1px dashed #eee;
      }
      .blist .bdoi {
        font-family: "Consolas", monospace; flex: 1;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .blist .bst { flex: 0 0 auto; color: var(--muted); }
      .blist .bst.ok { color: var(--ok); }
      .blist .bst.bad { color: var(--fail); }
      .blist .bst.warn { color: #b8860b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="head">
        <div class="dot">文</div>
        <div class="head-text">
          <div class="title" id="title">正在读取页面…</div>
          <div class="doi" id="doi"></div>
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <div class="banner" id="banner" hidden></div>

      <div class="loc">
        <div class="loc-main">
          <div class="loc-label">保存到</div>
          <div class="loc-value" id="folder">下载 / DOI取件</div>
        </div>
        <button class="ghost" id="pick">选择文件夹…</button>
      </div>

      <button class="primary" id="start" disabled>开始下载</button>

      <label class="zrow" id="zrow">
        <input type="checkbox" id="zotero" />
        <span id="zlabel">存入 Zotero</span>
        <span class="zstate" id="zstate"></span>
      </label>

      <select class="ztarget" id="ztarget" hidden></select>

      <details class="batch" id="batchBox">
        <summary>批量取件<span class="bcount" id="batchCount"></span></summary>
        <textarea id="batchText" rows="4" spellcheck="false"
          placeholder="每行一个 DOI 或论文链接，可一次粘贴很多条"></textarea>
        <input id="wvpnBase" type="text" spellcheck="false"
          placeholder="网关地址（可选）：https://wvpn.ustc.edu.cn" />
        <button id="batchStart" class="btn ghost">开始批量</button>
        <div class="bhint" id="batchHint"></div>
        <ul class="blist" id="batchList"></ul>
      </details>

      <div class="list" id="list"></div>
      <div class="tip" id="tip"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
